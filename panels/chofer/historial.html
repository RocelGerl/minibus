<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Mi Chofer /title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 1rem;
        }
        
        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }
        
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .card-header {
            background: white;
            border-bottom: 2px solid #f0f0f0;
            border-radius: 20px 20px 0 0 !important;
            padding: 1.5rem;
        }
        
        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            height: 100%;
        }
        
        .stats-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .stats-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .stats-icon.ganado {
            background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%);
            color: white;
        }
        
        .stats-icon.pasajeros {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .stats-icon.km {
            background: linear-gradient(135deg, #ff9e00 0%, #ff4d4d 100%);
            color: white;
        }
        
        .stats-icon.jornadas {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .stats-number {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #333;
        }
        
        .stats-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .filtros-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }
        
        .filtros-card h6 {
            color: #4361ee;
            font-weight: 600;
        }
        
        .table {
            margin-bottom: 0;
        }
        
        .table thead th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .table tbody tr {
            transition: all 0.3s ease;
        }
        
        .table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .table td {
            padding: 15px;
            vertical-align: middle;
            font-size: 0.9rem;
        }
        
        .badge-ruta {
            background: #e9ecef;
            color: #495057;
            padding: 5px 10px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        
        .btn-accion {
            padding: 5px 10px;
            margin: 0 2px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-accion:hover {
            transform: scale(1.1);
        }
        
        .btn-accion.btn-info {
            background: #4cc9f0;
            border: none;
            color: white;
        }
        
        .btn-accion.btn-primary {
            background: #4361ee;
            border: none;
            color: white;
        }
        
        .text-success {
            color: #28a745 !important;
            font-weight: 600;
        }
        
        .text-danger {
            color: #e63946 !important;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .stats-number {
                font-size: 1.5rem;
            }
            
            .table {
                font-size: 0.8rem;
            }
            
            .table td, .table th {
                padding: 10px;
            }
            
            .btn-accion {
                padding: 3px 6px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-arrow-left me-2"></i>
                Volver al panel
            </a>
            <span class="text-white">
                <i class="fas fa-history me-2"></i>
                Historial de jornadas
            </span>
        </div>
    </nav>

    <div class="container-fluid mt-4 pb-5">
        <!-- Filtros -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filtros-card">
                    <h6 class="mb-3">
                        <i class="fas fa-filter me-2 text-primary"></i>
                        Filtrar historial
                    </h6>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Desde</label>
                            <input type="date" class="form-control" id="fechaDesde">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Hasta</label>
                            <input type="date" class="form-control" id="fechaHasta">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Ruta</label>
                            <select class="form-select" id="filtroRuta">
                                <option value="">Todas las rutas</option>
                                <option value="288">Ruta 288</option>
                                <option value="42">Ruta 42</option>
                                <option value="15">Ruta 15</option>
                                <option value="7">Ruta 7</option>
                                <option value="21">Ruta 21</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button class="btn btn-primary w-100" onclick="aplicarFiltros()">
                                <i class="fas fa-search me-2"></i>Filtrar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-icon ganado">
                        <i class="fas fa-money-bill-wave"></i>
                    </div>
                    <div class="stats-number" id="totalGanado">Bs 0</div>
                    <div class="stats-label">Total ganado</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-icon pasajeros">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stats-number" id="totalPasajeros">0</div>
                    <div class="stats-label">Pasajeros</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-icon km">
                        <i class="fas fa-road"></i>
                    </div>
                    <div class="stats-number" id="totalKm">0 km</div>
                    <div class="stats-label">Kilómetros</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-icon jornadas">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="stats-number" id="totalJornadas">0</div>
                    <div class="stats-label">Jornadas</div>
                </div>
            </div>
        </div>

        <!-- Tabla de historial -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h6 class="mb-0">
                    <i class="fas fa-list me-2 text-primary"></i>
                    Jornadas registradas
                </h6>
                <button class="btn btn-success btn-sm" onclick="exportarExcel()">
                    <i class="fas fa-file-excel me-2"></i>Exportar Excel
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover" id="tablaHistorial">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Ruta</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                                <th>Duración</th>
                                <th>Pasajeros</th>
                                <th>Efectivo</th>
                                <th>Gastos</th>
                                <th>Neto</th>
                                <th>KM</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <!-- Se llena con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // ===== VARIABLES GLOBALES =====
        let datosHistorial = [];

        // ===== INICIALIZACIÓN =====
        document.addEventListener('DOMContentLoaded', function() {
            // Establecer fechas por defecto (último mes)
            const hoy = new Date();
            const mesPasado = new Date();
            mesPasado.setMonth(mesPasado.getMonth() - 1);
            
            // Formatear fechas para input date (YYYY-MM-DD)
            document.getElementById('fechaDesde').valueAsDate = mesPasado;
            document.getElementById('fechaHasta').valueAsDate = hoy;
            
            // Cargar datos
            cargarHistorial();
        });

        // ===== CARGAR HISTORIAL =====
        function cargarHistorial() {
            const historialGuardado = localStorage.getItem('historialJornadas');
            
            if(historialGuardado) {
                datosHistorial = JSON.parse(historialGuardado);
                // Asegurar que todos los campos tengan valores válidos
                datosHistorial = datosHistorial.map(j => ({
                    fecha: j.fecha || new Date().toISOString().split('T')[0],
                    inicio: j.inicio || '06:00',
                    fin: j.fin || '14:00',
                    ruta: j.ruta || '288',
                    pasajeros: j.pasajeros || 0,
                    efectivo: j.efectivo || 0,
                    gastos: j.gastos || 0,
                    neto: (j.efectivo || 0) - (j.gastos || 0),
                    km: j.km || 0
                }));
            } else {
                // Datos de ejemplo con valores correctos
                datosHistorial = generarDatosEjemplo();
            }
            
            actualizarTabla(datosHistorial);
            actualizarResumen(datosHistorial);
        }

        // ===== GENERAR DATOS DE EJEMPLO =====
        function generarDatosEjemplo() {
            const datos = [];
            const rutas = ['288', '42', '15', '7', '21'];
            const meses = [0, 1, 2, 3]; // Últimos 4 meses
            
            for(let i = 0; i < 20; i++) {
                const fecha = new Date();
                fecha.setDate(fecha.getDate() - i);
                
                // Generar valores aleatorios pero realistas
                const pasajeros = Math.floor(Math.random() * 150) + 50; // 50-200 pasajeros
                const efectivo = pasajeros * 2; // Bs 2 por pasajero
                const gastos = Math.floor(Math.random() * 80) + 20; // 20-100 Bs de gastos
                const km = (Math.random() * 120 + 40).toFixed(1); // 40-160 km
                
                // Horarios realistas
                const horaInicio = 6 + Math.floor(Math.random() * 2); // 6-7 AM
                const minInicio = Math.floor(Math.random() * 60);
                const horaFin = 14 + Math.floor(Math.random() * 4); // 14-17 PM
                const minFin = Math.floor(Math.random() * 60);
                
                datos.push({
                    fecha: fecha.toISOString().split('T')[0],
                    inicio: `${String(horaInicio).padStart(2, '0')}:${String(minInicio).padStart(2, '0')}`,
                    fin: `${String(horaFin).padStart(2, '0')}:${String(minFin).padStart(2, '0')}`,
                    ruta: rutas[Math.floor(Math.random() * rutas.length)],
                    pasajeros: pasajeros,
                    efectivo: efectivo,
                    gastos: gastos,
                    neto: efectivo - gastos,
                    km: parseFloat(km)
                });
            }
            
            // Ordenar por fecha descendente
            return datos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        }

        // ===== ACTUALIZAR TABLA =====
        function actualizarTabla(datos) {
            const tbody = document.getElementById('cuerpoTabla');
            
            if(!datos || datos.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="11" class="text-center py-5">
                            <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
                            <p class="text-muted">No hay registros en este período</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = datos.map(j => {
                // Calcular duración de forma segura
                let duracion = '0.0';
                try {
                    if(j.inicio && j.fin) {
                        const [horaInicio, minInicio] = j.inicio.split(':').map(Number);
                        const [horaFin, minFin] = j.fin.split(':').map(Number);
                        
                        if(!isNaN(horaInicio) && !isNaN(minInicio) && !isNaN(horaFin) && !isNaN(minFin)) {
                            const inicioMinutos = horaInicio * 60 + (minInicio || 0);
                            const finMinutos = horaFin * 60 + (minFin || 0);
                            const diffMinutos = finMinutos - inicioMinutos;
                            duracion = (diffMinutos / 60).toFixed(1);
                        }
                    }
                } catch(e) {
                    duracion = '0.0';
                }
                
                // Asegurar que los valores numéricos existan
                const pasajeros = j.pasajeros || 0;
                const efectivo = j.efectivo || 0;
                const gastos = j.gastos || 0;
                const neto = efectivo - gastos;
                const km = j.km || 0;
                
                // Formatear fecha
                let fechaFormateada = 'Fecha inválida';
                try {
                    fechaFormateada = new Date(j.fecha).toLocaleDateString('es-BO', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                } catch(e) {
                    fechaFormateada = j.fecha || 'Desconocida';
                }
                
                return `
                    <tr>
                        <td>${fechaFormateada}</td>
                        <td><span class="badge-ruta">Ruta ${j.ruta || 'N/A'}</span></td>
                        <td>${j.inicio || '--:--'}</td>
                        <td>${j.fin || '--:--'}</td>
                        <td>${duracion} h</td>
                        <td class="fw-bold">${pasajeros}</td>
                        <td>Bs ${efectivo}</td>
                        <td>Bs ${gastos}</td>
                        <td class="fw-bold ${neto > 0 ? 'text-success' : neto < 0 ? 'text-danger' : ''}">
                            Bs ${neto}
                        </td>
                        <td>${km} km</td>
                        <td>
                            <button class="btn btn-sm btn-info btn-accion" onclick='verDetalle(${JSON.stringify(j)})'>
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-primary btn-accion" onclick="generarPDF('${j.fecha}')">
                                <i class="fas fa-file-pdf"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ===== ACTUALIZAR RESUMEN =====
        function actualizarResumen(datos) {
            let totalEfectivo = 0;
            let totalPasajeros = 0;
            let totalKm = 0;
            
            datos.forEach(j => {
                totalEfectivo += (j.neto || (j.efectivo - j.gastos) || 0);
                totalPasajeros += (j.pasajeros || 0);
                totalKm += (j.km || 0);
            });
            
            document.getElementById('totalGanado').textContent = `Bs ${totalEfectivo}`;
            document.getElementById('totalPasajeros').textContent = totalPasajeros;
            document.getElementById('totalKm').textContent = totalKm.toFixed(1) + ' km';
            document.getElementById('totalJornadas').textContent = datos.length;
        }

        // ===== APLICAR FILTROS =====
        function aplicarFiltros() {
            const desde = document.getElementById('fechaDesde').value;
            const hasta = document.getElementById('fechaHasta').value;
            const ruta = document.getElementById('filtroRuta').value;
            
            const datosFiltrados = datosHistorial.filter(j => {
                let cumple = true;
                
                if(desde && j.fecha < desde) cumple = false;
                if(hasta && j.fecha > hasta) cumple = false;
                if(ruta && j.ruta !== ruta) cumple = false;
                
                return cumple;
            });
            
            actualizarTabla(datosFiltrados);
            actualizarResumen(datosFiltrados);
        }

        // ===== VER DETALLE =====
        function verDetalle(jornada) {
            if(!jornada) return;
            
            const pasajeros = jornada.pasajeros || 0;
            const efectivo = jornada.efectivo || 0;
            const gastos = jornada.gastos || 0;
            const neto = efectivo - gastos;
            const km = jornada.km || 0;
            
            // Calcular duración
            let duracion = '0.0 horas';
            try {
                if(jornada.inicio && jornada.fin) {
                    const [horaInicio, minInicio] = jornada.inicio.split(':').map(Number);
                    const [horaFin, minFin] = jornada.fin.split(':').map(Number);
                    
                    if(!isNaN(horaInicio) && !isNaN(minInicio) && !isNaN(horaFin) && !isNaN(minFin)) {
                        const inicioMinutos = horaInicio * 60 + (minInicio || 0);
                        const finMinutos = horaFin * 60 + (minFin || 0);
                        const diffMinutos = finMinutos - inicioMinutos;
                        duracion = (diffMinutos / 60).toFixed(1) + ' horas';
                    }
                }
            } catch(e) {
                duracion = '0.0 horas';
            }
            
            Swal.fire({
                title: 'Detalle de jornada',
                html: `
                    <div class="text-start">
                        <div class="border-bottom pb-2 mb-2">
                            <p class="mb-1"><strong>Fecha:</strong> ${new Date(jornada.fecha).toLocaleDateString('es-BO')}</p>
                            <p class="mb-1"><strong>Ruta:</strong> ${jornada.ruta || 'N/A'}</p>
                            <p class="mb-1"><strong>Horario:</strong> ${jornada.inicio || '--:--'} - ${jornada.fin || '--:--'} (${duracion})</p>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <p class="mb-1"><strong>👥 Pasajeros:</strong> ${pasajeros}</p>
                                <p class="mb-1"><strong>💰 Efectivo:</strong> Bs ${efectivo}</p>
                            </div>
                            <div class="col-6">
                                <p class="mb-1"><strong>💸 Gastos:</strong> Bs ${gastos}</p>
                                <p class="mb-1"><strong>📊 Neto:</strong> <span class="${neto > 0 ? 'text-success' : neto < 0 ? 'text-danger' : ''}">Bs ${neto}</span></p>
                            </div>
                        </div>
                        <p class="mb-0"><strong>📏 KM recorridos:</strong> ${km} km</p>
                    </div>
                `,
                icon: 'info',
                confirmButtonText: 'Cerrar',
                confirmButtonColor: '#4361ee',
                width: 400
            });
        }

        // ===== EXPORTAR A EXCEL =====
        function exportarExcel() {
            if(!datosHistorial || datosHistorial.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Sin datos',
                    text: 'No hay datos para exportar',
                    timer: 1500,
                    showConfirmButton: false
                });
                return;
            }
            
            // Crear CSV
            let csv = 'Fecha,Ruta,Inicio,Fin,Duración (h),Pasajeros,Efectivo (Bs),Gastos (Bs),Neto (Bs),KM\n';
            
            datosHistorial.forEach(j => {
                // Calcular duración
                let duracion = '0.0';
                try {
                    if(j.inicio && j.fin) {
                        const [horaInicio, minInicio] = j.inicio.split(':').map(Number);
                        const [horaFin, minFin] = j.fin.split(':').map(Number);
                        
                        if(!isNaN(horaInicio) && !isNaN(minInicio) && !isNaN(horaFin) && !isNaN(minFin)) {
                            const inicioMinutos = horaInicio * 60 + (minInicio || 0);
                            const finMinutos = horaFin * 60 + (minFin || 0);
                            const diffMinutos = finMinutos - inicioMinutos;
                            duracion = (diffMinutos / 60).toFixed(1);
                        }
                    }
                } catch(e) {
                    duracion = '0.0';
                }
                
                const pasajeros = j.pasajeros || 0;
                const efectivo = j.efectivo || 0;
                const gastos = j.gastos || 0;
                const neto = efectivo - gastos;
                const km = j.km || 0;
                
                csv += `${j.fecha},${j.ruta || 'N/A'},${j.inicio || '--:--'},${j.fin || '--:--'},${duracion},${pasajeros},${efectivo},${gastos},${neto},${km}\n`;
            });
            
            // Descargar archivo
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `historial_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            
            Swal.fire({
                icon: 'success',
                title: 'Exportado',
                text: 'Archivo CSV generado correctamente',
                timer: 1500,
                showConfirmButton: false
            });
        }

        // ===== GENERAR PDF (DEMO) =====
        function generarPDF(fecha) {
            Swal.fire({
                icon: 'info',
                title: 'Generando PDF',
                text: 'Función disponible en la versión completa',
                timer: 2000,
                showConfirmButton: false
            });
        }

        // ===== EXPORTAR FUNCIONES =====
        window.aplicarFiltros = aplicarFiltros;
        window.exportarExcel = exportarExcel;
        window.verDetalle = verDetalle;
        window.generarPDF = generarPDF;
    </script>
</body>
</html>
