<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Iniciar Sesión - Mi Chofer Pasajero</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9e00, #ff4d4d);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 3.5rem;
            color: #4361ee;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 0 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.1);
        }

        .input-group-text {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px 0 0 12px;
            border-right: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 50px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-invitado {
            background: transparent;
            color: #6c757d;
            border: 2px solid #e9ecef;
            height: 50px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-invitado:hover {
            background: #e9ecef;
            color: #495057;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #6c757d;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e9ecef;
        }

        .divider span {
            padding: 0 10px;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
        }

        .footer-links a {
            color: #4361ee;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .telefono-input {
            display: flex;
            align-items: center;
        }

        .telefono-prefijo {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            border-radius: 12px 0 0 12px;
            font-weight: 600;
        }

        .telefono-number {
            flex: 1;
            border-radius: 0 12px 12px 0 !important;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card animate__animated animate__fadeIn">
            <div class="logo">
                <i class="fas fa-bus"></i>
                <h2>Mi Chofer</h2>
                <p>Inicia sesión como pasajero</p>
            </div>

            <!-- Login con celular (principal en Bolivia) -->
            <form id="loginForm" onsubmit="event.preventDefault(); iniciarSesion();">
                <div class="mb-3">
                    <label class="form-label fw-bold">Número de celular</label>
                    <div class="telefono-input">
                        <span class="telefono-prefijo">+591</span>
                        <input type="tel" class="form-control telefono-number" id="telefono" 
                               placeholder="71234567" maxlength="8" required>
                    </div>
                    <small class="text-muted">Ingresa tu número sin 0 ni el +591</small>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" 
                               placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar sesión
                </button>
            </form>

            <div class="divider">
                <span>O CONTINÚA CON</span>
            </div>

            <button class="btn btn-invitado w-100 mb-3" onclick="continuarInvitado()">
                <i class="fas fa-user me-2"></i>Modo Invitado
            </button>

            <div class="footer-links">
                <p class="mb-2">¿No tienes cuenta? <a href="#" onclick="registrarse()">Regístrate aquí</a></p>
                <p class="mb-0"><a href="#" onclick="recuperarPassword()">¿Olvidaste tu contraseña?</a></p>
            </div>
        </div>

        <!-- Opción para choferes -->
        <div class="text-center mt-3">
            <small class="text-white-50">
                ¿Eres chofer? 
                <a href="../chofer/index.html" class="text-white fw-bold">Accede al panel chofer</a>
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function iniciarSesion() {
            const telefono = document.getElementById('telefono').value;
            const password = document.getElementById('password').value;
            
            if (!telefono || telefono.length < 7) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Ingresa un número de celular válido'
                });
                return;
            }
            
            if (!password) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Ingresa tu contraseña'
                });
                return;
            }

            // Simular inicio de sesión (en producción sería llamado a API)
            Swal.fire({
                title: 'Iniciando sesión...',
                html: 'Por favor espera',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            setTimeout(() => {
                // Guardar datos del usuario
                const userData = {
                    nombre: 'Pasajero ' + telefono,
                    telefono: telefono,
                    email: 'pasajero@email.com',
                    saldo: 50,
                    preferencias: {
                        rutasFrecuentes: ['288', '42']
                    }
                };
                
                localStorage.setItem('token', 'token-simulado-123');
                localStorage.setItem('userData', JSON.stringify(userData));
                localStorage.setItem('modoInvitado', 'false');
                
                Swal.close();
                window.location.href = 'dashboard.html';
            }, 1500);
        }

        function continuarInvitado() {
            Swal.fire({
                title: 'Modo Invitado',
                text: 'Podrás ver minibuses cercanos, pero algunas funciones como pago QR estarán limitadas',
                icon: 'info',
                showCancelButton: true,
                confirmButtonColor: '#4361ee',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, continuar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.setItem('modoInvitado', 'true');
                    localStorage.removeItem('token');
                    localStorage.removeItem('userData');
                    window.location.href = 'dashboard.html';
                }
            });
        }

        function registrarse() {
            Swal.fire({
                title: 'Registro de pasajero',
                html: `
                    <div class="text-start">
                        <div class="mb-3">
                            <label class="form-label">Nombres completos</label>
                            <input type="text" class="form-control" id="regNombres" placeholder="Juan Carlos">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="regApellidos" placeholder="Pérez Mamani">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Celular</label>
                            <div class="input-group">
                                <span class="input-group-text">+591</span>
                                <input type="tel" class="form-control" id="regTelefono" placeholder="71234567">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email (opcional)</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="correo@email.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="••••••••">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Registrarse',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#28a745',
                preConfirm: () => {
                    const nombres = document.getElementById('regNombres').value;
                    const telefono = document.getElementById('regTelefono').value;
                    
                    if (!nombres || !telefono) {
                        Swal.showValidationMessage('Completa los campos obligatorios');
                        return false;
                    }
                    
                    Swal.fire({
                        icon: 'success',
                        title: '¡Registro exitoso!',
                        text: 'Ahora puedes iniciar sesión',
                        timer: 2000
                    });
                }
            });
        }

        function recuperarPassword() {
            Swal.fire({
                title: 'Recuperar contraseña',
                html: `
                    <div class="text-start">
                        <p class="mb-3">Ingresa tu número de celular para recibir un código de verificación</p>
                        <div class="input-group">
                            <span class="input-group-text">+591</span>
                            <input type="tel" class="form-control" id="recTelefono" placeholder="71234567">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Enviar código',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#4361ee'
            });
        }
    </script>
</body>
</html>
